<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoiLoNote Study Archive</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,sans-serif;color:#172033;background:#f5f7fb}
header{padding:18px 22px;background:#172b4d;color:#fff}h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:#d8e2f2}
main{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:14px;padding:14px;max-width:1500px;margin:auto}
section{background:#fff;border:1px solid #dce3ed;border-radius:12px;padding:14px;min-width:0}
.controls{display:grid;gap:9px}input,button{font:inherit}input[type=search]{width:100%;padding:10px;border:1px solid #b9c5d6;border-radius:8px}
button,.filelabel{padding:9px 12px;border:0;border-radius:8px;background:#2457c5;color:white;cursor:pointer;display:inline-block}
button.secondary,.filelabel.secondary{background:#4a5870}button:disabled{opacity:.5;cursor:wait}
.filelabel input{display:none}.muted{color:#64748b}.count{font-weight:700;margin:10px 0}
#items{display:grid;gap:7px;max-height:68vh;overflow:auto;margin-top:10px}
.item{border:1px solid #dce3ed;border-radius:8px;padding:10px;cursor:pointer;background:#fff;text-align:left;color:inherit}
.item[aria-current=true]{border-color:#2457c5;background:#eef4ff}.item strong{display:block}.item small{color:#64748b}
#detail{white-space:pre-wrap;overflow-wrap:anywhere;max-height:68vh;overflow:auto}
.warning{color:#9a3412;background:#fff7ed;padding:8px;border-radius:7px;margin:8px 0}
a{color:#2457c5;overflow-wrap:anywhere}
@media(max-width:760px){main{grid-template-columns:1fr}#items{max-height:35vh}}
</style></head>
<body>
<header><h1>LoiLoNote Study Archive</h1><p>ローカル保存した授業資料を検索・閲覧する画面。資料は外部送信されません。</p></header>
<main>
<section>
<div class="controls">
<label class="filelabel">JSON資料を読み込む<input id="files" type="file" accept=".json,application/json" multiple></label>
<input id="search" type="search" placeholder="教科・資料名・本文を検索">
<button id="export" class="secondary">統合索引をJSON出力</button>
</div>
<div id="count" class="count">0件</div><div id="items"></div>
<p class="muted">ページごとのJSON、または拡張機能の統合索引JSONを読み込めます。PNG画像は別ファイルとして保存されています。</p>
</section>
<section><h2 id="detailTitle">資料を選択してください</h2><div id="detail" class="muted">左側から資料を選ぶと本文と取得品質を表示します。</div></section>
</main><script src="archive.js"></script></body></html>
