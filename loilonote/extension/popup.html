<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoiLoNote Local Reader</title>
<style>
body{width:350px;margin:0;padding:14px;font:13px/1.5 system-ui,sans-serif;color:#172033}h1{font-size:16px;margin:0 0 6px}p{color:#48566a}button{width:100%;padding:10px;margin:4px 0;border:0;border-radius:8px;background:#2457c5;color:white;font-weight:600}button:disabled{opacity:.5}#items{max-height:220px;overflow:auto;border:1px solid #d7deea;border-radius:8px;padding:6px}.item{display:flex;gap:7px;padding:5px 2px;overflow-wrap:anywhere}#status{min-height:3em;white-space:pre-wrap;margin-top:8px}small{color:#65738a}
</style></head><body>
<h1>LoiLoNote Local Reader</h1>
<p>画面上の教材候補を検出し、選択した候補の可視本文を一括取得します。候補を確認してから実行してください。</p>
<button id="scan">教材候補を検出</button><div id="items"><small>先に候補を検出してください。</small></div>
<button id="collect" disabled>選択した候補を一括取得</button><button id="current">表示中ページだけ保存</button>
<div id="status" role="status"></div>
<small>可視DOMのみ。Cookie・認証情報・非表示データは取得せず、外部送信もしません。未対応の画面構造では停止します。</small>
<script src="popup.js"></script></body></html>
