<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoiLoNote Local Reader</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 14px/1.55 system-ui,sans-serif; color:#172033; }
    h1 { font-size:16px; margin:0 0 8px; }
    p { margin:8px 0 12px; color:#48566a; }
    button { width:100%; padding:10px; margin:4px 0; border:0; border-radius:8px; background:#2457c5; color:white; font-weight:600; cursor:pointer; }
    button.secondary { background:#43516a; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { min-height:3em; margin-top:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
    small { color:#65738a; }
  </style>
</head>
<body>
  <h1>LoiLoNote Local Reader v0.7.2</h1>
  <p>表示中ページの本文・画面画像・画面構造診断をローカル保存します。URLは同一オリジンのパスだけ保存し、クエリ・フラグメントと外部URLは保存しません。</p>
  <button id="scanFolders">フォルダ構成を自動巡回</button>
  <button id="capture">このページを取得・保存</button>
  <button id="export" class="secondary">保存済み全ページの索引を出力</button>
  <button id="openArchive" class="secondary">資料検索画面を開く</button>
  <div id="status" role="status">対象ページを開いてから取得してください。</div>
  <small>フォルダ巡回はユーザー開始時のみ実行し、検索欄より上の階層表示アイコンは除外し、一覧内の未識別アイコンがある場合は停止します。教材本文の一括取得は未対応です。ログイン操作・Cookie取得・外部送信はしません。画面画像は表示範囲のみです。数式等は原資料との照合が必要です。</small>
  <script src="popup.js"></script>
</body>
</html>
