<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoiLoNote Local Reader</title>
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #172033; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 8px 0 12px; color: #48566a; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2457c5; color: white; font-weight: 600; cursor: pointer; }
    #status { min-height: 2.5em; margin-top: 10px; white-space: pre-wrap; }
    small { color: #65738a; }
  </style>
</head>
<body>
  <h1>LoiLoNote Local Reader</h1>
  <p>現在表示しているページの可視テキストとリンクだけをJSONに保存します。</p>
  <button id="capture">このページを取得</button>
  <div id="status" role="status"></div>
  <small>ログイン情報・Cookie・非表示データは取得・送信しません。</small>
  <script src="popup.js"></script>
</body>
</html>
